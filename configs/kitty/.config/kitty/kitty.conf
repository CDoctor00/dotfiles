# ─────────────────────────────────────────
#  FONTS
# ─────────────────────────────────────────
font_family         FiraCode Nerd Font
bold_font           auto
italic_font         auto
bold_italic_font    auto
font_size           14.0

# Ligature
font_features FiraCodeNF-Reg +liga +calt


# ─────────────────────────────────────────
#  COLORS — Nord Palette
# ─────────────────────────────────────────
background  #2E3440
foreground  #D8DEE9

selection_background  #3B4252
selection_foreground  #D8DEE9

cursor                  #D8DEE9
cursor_text_color       #2E3440

color0   #3B4252
color8   #4C566A
color1   #BF616A
color9   #BF616A
color2   #A3BE8C
color10  #A3BE8C
color3   #EBCB8B
color11  #EBCB8B
color4   #81A1C1
color12  #81A1C1
color5   #B48EAD
color13  #B48EAD
color6   #88C0D0
color14  #8FBCBB
color7   #E5E9F0
color15  #ECEFF4


# ─────────────────────────────────────────
#  WINDOWS
# ─────────────────────────────────────────
window_padding_width        10
window_border_width         1px
active_border_color         #88C0D0
inactive_border_color       #3B4252
draw_minimal_borders        yes

# Resize
resize_in_steps             yes


# ─────────────────────────────────────────
#  TAB BAR
# ─────────────────────────────────────────
tab_bar_style               powerline
tab_powerline_style         slanted
tab_bar_min_tabs            2         
tab_title_template          " {index}: {title} "
active_tab_foreground       #2E3440
active_tab_background       #88C0D0
inactive_tab_foreground     #D8DEE9
inactive_tab_background     #3B4252


# ─────────────────────────────────────────
#  SCROLLBACK
# ─────────────────────────────────────────
scrollback_lines            10000
# Open the scrollback in bat (syntax highlighting)
scrollback_pager            bat --paging=always --style=plain


# ─────────────────────────────────────────
#  URL
# ─────────────────────────────────────────
open_url_with               default
url_color                   #88C0D0
url_style                   single      # none | single | double | curly


# ─────────────────────────────────────────
#  AUDIO
# ─────────────────────────────────────────
enable_audio_bell           yes


# ─────────────────────────────────────────
#  REMOTE CONTROL
# ─────────────────────────────────────────
allow_remote_control        yes
listen_on                   unix:/tmp/kitty


# ─────────────────────────────────────────
#  OTHER SHORTCUTS
# ─────────────────────────────────────────
# Zoom font
map ctrl+equal    change_font_size all +1.0
map ctrl+minus    change_font_size all -1.0
map ctrl+0        change_font_size all 0

# New window in the same directory
map ctrl+shift+t  new_tab_with_cwd
map ctrl+shift+enter new_window_with_cwd
