# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hyprland.org/Configuring/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf


################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=,3440x1440@144,auto,auto


###################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
$terminal = kitty
$fileManager = thunar
$menu = ~/.config/rofi/launchers/type-2/launcher.sh
$powerMenu = ~/.config/rofi/powermenu/type-2/powermenu.sh


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

exec-once = hyprpaper
exec-once = waybar
exec-once = dunst
exec-once = systemctl --user start hyprpolkitagent
exec-once = dconf load /org/gnome/desktop/interface/ < ~/.config/hypr/dconf/interface.conf
exec-once = ~/.config/hypr/scripts/xdg.sh
exec-once = dropbox start -i
exec-once = clipse -listen

exec-once = [workspace 1 silent] discord
exec-once = [workspace 1 silent] spotify
exec-once = [workspace 2 silent] code 
exec-once = [workspace 2 silent] firefox


#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/

envd = XCURSOR_SIZE,24
envd = HYPRCURSOR_SIZE,24
env = HYPRSHOT_DIR,$HOME/Pictures/Screenshots


#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hyprland.org/Configuring/Variables/

#---------#
# GENERAL #
#---------#

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 5
    gaps_out = 10

    border_size = 2

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(88C0D0ff) rgba(81A1C1ff) 45deg
    col.inactive_border = rgba(2E3440aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = true

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    # Check https://wiki.hypr.land/Configuring/Dwindle-Layout/ or https://wiki.hypr.land/Configuring/Master-Layout/
    layout = dwindle
}

#------------#
# DECORATION #
#------------#

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 15
    
    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 0.95

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

#------------#
# ANIMATIONS #
#------------#

# https://wiki.hypr.land/Configuring/Animations/
animations {
    enabled = true

    #----------------------------
    # BEZIERS CURVES DEFINITIONS
    #----------------------------
    bezier = easeOutQuint,0.25,1,0.30,1
    bezier = easeInOutCubic,0.65,0.05,0.35,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    #----------------------------
    # WINDOWS AND WORKSPACES
    #----------------------------
    animation = windows, 1, 4, easeOutQuint, gnomed
    animation = windowsIn, 1, 4, easeOutQuint, gnomed
    animation = windowsOut, 1, 4, linear, gnomed

    animation = workspaces, 1, 3, almostLinear, slidefade
    animation = workspacesIn, 1, 3, almostLinear, slidefade
    animation = workspacesOut, 1, 3, almostLinear, slidefade

    #----------------------------
    # OTHERS
    #----------------------------
    animation = global, 1, 10, default
    animation = border, 1, 5, easeOutQuint

    # Fades
    animation = fadeIn, 1, 2, almostLinear
    animation = fadeOut, 1, 2, almostLinear
    animation = fade, 1, 3, quick

    # Layers (popups, menu, etc.)
    animation = layers, 1, 4, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 2, almostLinear
    animation = fadeLayersOut, 1, 1.5, almostLinear
}

#----------------#
# DWINDLE LAYOUT #
#----------------#

# https://wiki.hyprland.org/Configuring/Layouts/Dwindle-Layout/
dwindle {
    # Preserves the split direction (vertical/horizontal) for new windows
    # If true, new windows will follow the same split direction as the last split
    preserve_split = true
    
    # When enabled, applies intelligent algorithm for space division
    # Maintains window proportions during tiling operations
    smart_split = false
    
    # If true, the cursor remains centered on the split point during resize
    # Otherwise the cursor stays in its original position
    smart_resizing = true
    
    # Controls whether to force splits for new windows
    # 0 = default (normal behavior)
    # 1 = always force splits
    # 2 = never split (one window per workspace)
    force_split = 0
}

#----------------#
# MISC VARIABLES #
#----------------#

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers.
    disable_splash_rendering = true # If true disables the Hyprland splash rendering.
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background.
}


#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant = intl
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
}

###################
### KEYBINDINGS ###
###################

# https://wiki.hyprland.org/Configuring/Keywords/
# https://wiki.hyprland.org/Configuring/Binds/

$mainMod = SUPER


#---------#
# GENERAL #
#---------#

# Apps
bind = $mainMod,       T,      exec,            $terminal
bind = $mainMod,       A,      exec,            $menu
bind = $mainMod,       ESCAPE, exec,            $powerMenu
bind = $mainMod,       F,      exec,            $fileManager
bind = $mainMod,       V,      exec,            kitty --class clipse -e clipse

# Windows
bind = $mainMod,       W,      togglefloating,
bind = $mainMod,       Q,      killactive,
bind = ALT,            F4,     killactive,
bind = ALT,            RETURN, fullscreen

# Dwindle layout
bind = $mainMod,       P,      pseudo,
bind = $mainMod,       J,      layoutmsg,       togglesplit

# Screenshots
bind = $mainMod,       PRINT,  exec,            hyprshot -m output
bind = ,               PRINT,  exec,            hyprshot -m region


#-------#
# FOCUS #
#-------#

bind = $mainMod,       left,   movefocus,       l
bind = $mainMod,       right,  movefocus,       r
bind = $mainMod,       up,     movefocus,       u
bind = $mainMod,       down,   movefocus,       d


#---------#
# WINDOWS #
#---------#

# Move with keyboard
bind = $mainMod SHIFT, left,   movewindow,      l
bind = $mainMod SHIFT, right,  movewindow,      r
bind = $mainMod SHIFT, up,     movewindow,      u
bind = $mainMod SHIFT, down,   movewindow,      d

# Resize with keyboard
binde = $mainMod CTRL, left,   resizeactive,    -30 0
binde = $mainMod CTRL, right,  resizeactive,     30 0
binde = $mainMod CTRL, up,     resizeactive,     0 -30
binde = $mainMod CTRL, down,   resizeactive,     0  30

# Move/resize with mouse
bindm = $mainMod,      mouse:272, movewindow    #left click
bindm = $mainMod,      mouse:273, resizewindow  #right click


#------------#
# WORKSPACES #
#------------#

# Switch
bind = $mainMod,       1,      workspace,       1
bind = $mainMod,       2,      workspace,       2
bind = $mainMod,       3,      workspace,       3
bind = $mainMod,       4,      workspace,       4
bind = $mainMod,       5,      workspace,       5
bind = $mainMod,       6,      workspace,       6
bind = $mainMod,       7,      workspace,       7
bind = $mainMod,       8,      workspace,       8
bind = $mainMod,       9,      workspace,       9
bind = $mainMod,       0,      workspace,       10

# Move window to workspace
bind = $mainMod SHIFT, 1,      movetoworkspace, 1
bind = $mainMod SHIFT, 2,      movetoworkspace, 2
bind = $mainMod SHIFT, 3,      movetoworkspace, 3
bind = $mainMod SHIFT, 4,      movetoworkspace, 4
bind = $mainMod SHIFT, 5,      movetoworkspace, 5
bind = $mainMod SHIFT, 6,      movetoworkspace, 6
bind = $mainMod SHIFT, 7,      movetoworkspace, 7
bind = $mainMod SHIFT, 8,      movetoworkspace, 8
bind = $mainMod SHIFT, 9,      movetoworkspace, 9
bind = $mainMod SHIFT, 0,      movetoworkspace, 10

# Scroll through workspaces
bind = $mainMod,       mouse_down, workspace,   e+1
bind = $mainMod,       mouse_up,   workspace,   e-1

# Special workspace (scratchpad)
bind = $mainMod,       S,      togglespecialworkspace, magic
bind = $mainMod SHIFT, S,      movetoworkspace,        special:magic


#-------#
# MEDIA #
#-------#

# Volume
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute,     exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Brightness
bindel = , XF86MonBrightnessUp,   exec, brightnessctl s 10%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl s 10%-

# Playerctl
bindl = , XF86AudioNext,  exec, playerctl next
bindl = , XF86AudioPrev,  exec, playerctl previous
bindl = , XF86AudioPlay,  exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause


##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Prevents all applications (class:.*) from requesting or responding to maximize events.
# This helps maintain consistent tiling behavior and stops apps from automatically maximizing.
windowrule {
    name = prevent-maximize
    match:class = .*
    suppress_event = maximize
}

# Fixes XWayland focus issues, specifically during drag-and-drop.
# Prevents invisible/helper windows (empty class and title) in XWayland from stealing focus.
windowrule {
    name = fix-drag-and-drop
    match:class = ^$
    match:title = ^$
    match:xwayland = 1
    match:float = 1
    match:fullscreen = 0
    match:pin = 0
    no_focus = on
}

# Opens clipse clipboard manager in a centered floating window when SUPER+V is pressed.
# The window is pinned to stay visible across all workspaces until dismissed.
windowrule {
    name = clipse-floating
    match:class = ^clipse$
    float = true
    size = 700 500
    center = true
    pin = true
}